<button matButton (click)="add()">add</button>

<p class="selection-demo-hint">Selection is saved remotely. Rows 0, 10, 20… simulate a backend error.</p>
@if (selectionErrorMessage(); as message) {
    <p class="selection-demo-error" role="alert">{{ message }}</p>
}

<div style="height: 800px">
    <kles-dynamic-table #table [tableConfig]="config" (selectionError)="onSelectionError($event)">
        <div klesTableFooterStart>
            <mat-icon>warning</mat-icon>
            Événement déprécié

            <mat-divider class="footer-divider" vertical></mat-divider>

            <mat-icon>warning</mat-icon>
            Connexion invalide ou manquante
        </div>
    </kles-dynamic-table>
</div>

<div>Lazy</div>
<div style="height: 800px">
    <kles-dynamic-table #lazyTable [tableConfig]="lazyConfig"></kles-dynamic-table>
</div>
