<kles-table class="paginated"></kles-table>
<div class="table-footer">
    <div class="table-footer-start">
        <ng-content select="[klesTableFooterStart]"></ng-content>
    </div>
    <ng-template #inlinePaginator></ng-template>
</div>
<ng-template #paginatorTemplate>
    <mat-paginator
        klesRegisterPaginator
        class="paginator"
        [class.paginator-external]="paginatorOutlet()"
        [disabled]="disabled()"
    ></mat-paginator>
</ng-template>
