@if (dragHandle()) {
    <button
        type="button"
        matIconButton
        cdkDragHandle
        class="drag-handle"
        aria-label="Déplacer la ligne"
        (click)="stopPropagation($event)"
        (dblclick)="stopPropagation($event)"
    >
        <mat-icon>drag_indicator</mat-icon>
    </button>
}
@if (column().canExpand) {
    <button matIconButton class="expand-button" (click)="expandRow(); stopPropagation($event)">
        @if (this.expandedRow()) {
            <mat-icon>keyboard_arrow_down</mat-icon>
        } @else {
            <mat-icon>chevron_right</mat-icon>
        }
    </button>
}
@if (column().canExpandNode) {
    <span class="tree-indent" [style.width.px]="depth() * 24" aria-hidden="true"></span>
    @if (hasChildren()) {
        <button
            matIconButton
            class="expand-button"
            [disabled]="loadingNode()"
            [attr.aria-expanded]="expandedNode()"
            [attr.aria-label]="expandedNode() ? 'Réduire la ligne' : 'Développer la ligne'"
            (click)="expandNode(); stopPropagation($event)"
        >
            @if (loadingNode()) {
                <mat-icon class="tree-loading-icon">more_horiz</mat-icon>
            } @else if (expandedNode()) {
                <mat-icon>keyboard_arrow_down</mat-icon>
            } @else {
                <mat-icon>chevron_right</mat-icon>
            }
        </button>
    } @else {
        <span class="expand-button-spacer" aria-hidden="true"></span>
    }
}
<div class="cell-field"><ng-content></ng-content></div>
