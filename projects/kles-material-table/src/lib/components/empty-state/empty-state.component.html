<section class="empty-state" role="status" aria-live="polite">
    <div class="empty-state__panel">
        <div class="empty-state__visual" aria-hidden="true">
            <div class="empty-state__table-icon">
                <span class="empty-state__table-header"></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="empty-state__badge">
                <mat-icon>remove</mat-icon>
            </div>
        </div>

        <div class="empty-state__content">
            <h2 class="empty-state__title">
                {{ intl.emptyStateTitle }}
            </h2>

            <p class="empty-state__description">
                {{ intl.emptyStateDescription }}
            </p>
        </div>
    </div>
</section>
